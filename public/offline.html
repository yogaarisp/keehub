<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f59e0b">
    <title>Koneksi Terputus — KeeHub</title>
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --amber: #f59e0b;
            --amber-hover: #d97706;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --card-bg: rgba(255, 255, 255, 0.9);
                --border: rgba(0, 0, 0, 0.08);
                --text: #0f172a;
                --text-muted: #64748b;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            border-radius: 1.25rem;
            background: rgba(245, 158, 11, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--amber);
        }
        .icon-circle svg {
            width: 36px;
            height: 36px;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 0.925rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            background: var(--amber);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
        }
        .btn-retry:hover {
            background: var(--amber-hover);
            transform: translateY(-1px);
        }
        .btn-retry:active {
            transform: scale(0.97);
        }
        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-circle">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.829-2.829M3 3l18 18M9.879 9.879a3 3 0 004.242 4.242" />
            </svg>
        </div>
        <h1>Anda Sedang Offline</h1>
        <p>Koneksi internet Anda terputus. Silakan periksa jaringan Wi-Fi atau data seluler Anda lalu coba lagi.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Muat Ulang Halaman
        </button>
        <div class="footer-note">KeeHub PWA • Toko PC & IT Service</div>
    </div>
</body>
</html>
